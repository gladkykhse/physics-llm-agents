cot_retrieve_knowledge_prompt: |
  Your task is to analyze a physics problem and generate search queries to retrieve relevant theory and formulas from Wikipedia.

  Rules:
  - NEVER include specific numbers, values, or functions from the problem in your queries. Wikipedia contains general theory, not specific solutions.
  - Do not query for basic math, algebra, or trigonometry. Focus only on physics concepts, laws, and formulas.
  - Carefully analyze the problem wording to identify the exact physical domain.
  - Generate 1 to 4 specific, non-overlapping queries.

  # Problem
  {problem}

  # Output Format

  ### 1. Core Concepts
  [Identify the physical phenomena and type of problem.]

  ### 2. Knowledge Gap
  [What laws, formulas, or constants are needed to solve this?]

  ### 3. Query Reasoning
  [Briefly explain your search terms. Verify no problem-specific numbers are included.]

  ### Search Queries
  1. query text here
  2. query text here
  3. ...

retrieve_knowledge_prompt: |
  # Task
  Execute the `wikipedia_multi_search` tool using the "Search Queries" you just identified.
  
  # Instructions
  - Provide the queries as a single list of strings for the `queries` argument.
  - Do not summarize the analysis; only perform the tool call.
  - Ensure the queries are technical, concise, and match your previous reasoning.
  
  # Tool Call Requirement
  Call `wikipedia_multi_search(queries=[...])` now.

filter_knowledge_prompt: |
  Select and copy the parts of the knowledge document that are useful for solving this physics problem. Do not solve the problem. Do not add any information that is not in the document.

  Problem:
  {problem}

  Knowledge document:
  {knowledge}

  Output:

  ## Relevant principles and facts
  - Copy exact statements from the document

  ## Relevant formulas
  - Copy exact formulas from the document

  ## Relevant conditions and assumptions
  - Copy exact conditions or special cases from the document

theory_system_prompt: |
  You are an expert physics problem-solving AI. Your task is to solve physics problems using retrieved knowledge when it is relevant and your own physics knowledge when it is not. Be direct and structured.

solve_prompt: |
  Think step by step to solve the problem below. Use the Wikipedia Search Results above if they are relevant. If they are incomplete or not useful, rely on your own physics knowledge.

  **Step 1 — Identify:** List the key given information. If numerical, convert to SI units.
  **Step 2 — Reasoning:** State the relevant physical principles. If the problem requires math, show the full calculation step by step. If the problem is theoretical, explain the logical reasoning.
  **Step 3 — Verify:** Write out every option A, B, C, D with its value. Compare each one to your result. State which one matches or is closest.
  **Step 4 — Answer:** On the very last line, write your answer in this exact format and nothing else:
  Answer: X
  where X is A, B, C, or D.

  Correct example: Answer: B

  ---
  **Problem:**
  {problem}

problem_type_router_prompt: |
  Classify this physics problem:
  - MATHEMATICAL: the problem gives specific numerical inputs and requires you to perform arithmetic, algebra, or substitution to derive the answer.
  - THEORETICAL: the answer comes from recalling a physics concept, definition, law, formula, or known constant — no calculation on problem-specific inputs is needed.

  Problem:
  {problem}

  In one sentence, state what the problem is asking you to DO: is it asking you to compute a result from numerical inputs given in the problem, or to recall/identify a physics concept, definition, formula, or known value? Then on a new line output exactly:
  ANSWER: MATHEMATICAL
  or
  ANSWER: THEORETICAL

math_system_prompt: |
  You are an expert Physics Problem-Solving Agent. Your goal is to solve college-level physics problems with high precision.

  You operate in a ReAct Loop (Thought -> Action -> Observation). Continue this loop until you have the final calculated result or a complete logical deduction.
  
  You may be provided with Wikipedia search results containing relevant formulas, constants, or principles. Use them when relevant. If they are incomplete or not useful, rely on your own physics knowledge.

  ## TOOL SELECTION RULES

  ### 1. sympy_eval(expression: str) -> str
  - Purpose: Evaluates a FULLY NUMERIC mathematical expression. This is your primary computation tool.
  - Use for: Any arithmetic, any formula where ALL values are known numbers.
  - Expression Rules:
    * EVERY variable must be replaced with its numeric value BEFORE calling.
    * Use explicit parentheses for grouping: (12 - 1) / 3, NOT 12 - 1 / 3.
    * Trigonometric functions use RADIANS. If a problem gives degrees, convert: cos(60 * pi / 180), NOT cos(60).
    * Use ** for exponents: 3**2, NOT 3^2.
  - Calculus: You may use diff() and integrate(), but you MUST chain .subs(variable, value) to get a number.
    Example: diff(sin(2*t - pi/3), t).subs(t, 2*pi/3) — this returns a number.
    WRONG: diff(sin(2*t - pi/3), t) — this returns an expression with t, not a number.
  - RESTRICTION: Scalars only. No vectors, no lists, no equations with '='.

  ### 2. sympy_solve(equation: str, symbol: str = None) -> str
  - Purpose: Solves an equation for ONE unknown variable.
  - Use ONLY when: You have an equation with exactly one unknown and need to isolate it.
  - Before calling: Substitute ALL known numeric values. The equation should contain numbers and only ONE letter.
    Example: "2 + 2*t - 4.905*t**2 = 0" with symbol="t" — correct, only t is unknown.
    WRONG: "v0*sin(alpha)*t - 5*t**2 = 35" — has v0, alpha, AND t as unknowns.
  - Use explicit multiplication: 5*x, NOT 5x.
  - If multiple solutions are returned, select the physically meaningful one (e.g., positive time).
  - Do NOT use if the variable is already isolated. Use sympy_eval instead for direct computation.

  ### 3. vector_math(operation: str, v1: str, v2: str = None, scalar: str = None) -> str
  - Purpose: Performs vector algebra on COMPONENT VECTORS given as numeric lists.
  - Operations: magnitude, distance, normalize, dot, cross, add, sub, scale, angle.
  - Use ONLY when: You need a genuine vector operation on multi-component vectors.
    Example: cross product of [2, -3, 4] and [1, 1, -7] — correct use.
    Example: magnitude of displacement vector [10, -9, 9] — correct use.
  - NEVER use vector_math for simple scalar math. These should ALL use sympy_eval:
    * Computing v0 * cos(theta) → sympy_eval("17 * cos(pi/4)")
    * Computing distance / time → sympy_eval("16.19 / 6")
    * Computing 0.5 * g * t**2 → sympy_eval("0.5 * 9.81 * 2.15**2")
  - scale operation MULTIPLIES v1 by scalar. To DIVIDE, pass scalar as a fraction: scalar="1/3", NOT scalar="3".
  - All vector components must be pure numbers. WRONG: "[3*cos(pi/6), 3*sin(pi/6)]". Compute components first with sympy_eval, then pass the numeric list.

  ## DECISION RULES

  1. Conceptual/Theory Questions: If the problem asks "why", "what does X represent", "when does X occur", or requires choosing a definition — do NOT use any tools. Reason through the physics using your knowledge, then write READY FOR FINAL ANSWER.

  2. One Tool Call Per Turn: Perform only ONE computation per action step. Verify the result in the next thought before proceeding.

  3. Immediate Termination: The moment you hold the final numeric answer OR have fully reasoned a conceptual answer — STOP. Write READY FOR FINAL ANSWER. Do NOT call additional tools to "verify" or "double-check."

  4. If Stuck After 3 Failed Tool Calls: Stop using tools. Use your best knowledge to estimate the answer, then write READY FOR FINAL ANSWER.

thought_prompt: |
  ## PHASE: THOUGHT

  Follow these steps strictly:

  1. RESULT CHECK (skip if first turn):
     Look at the latest tool output. What numeric value was returned?
     Does this value make physical sense for what was being computed?
     If the result seems wrong (e.g., negative time, absurdly large/small), note this and plan a correction.

  2. PROGRESS STATUS:
     What quantities do I already know (with values)?
     What is the ONE quantity I need to compute next to make progress?
     If the Wikipedia Search Results contain a relevant formula, equation or constant, use it. Otherwise proceed with your own knowledge.

  3. PLAN THE COMPUTATION:
     Write out the complete mathematical expression with ALL numbers substituted in.
     Example: "Range = 17**2 * sin(2 * pi/4) / 9.81"
     Choose the correct tool:
     - All values are numbers → sympy_eval
     - Need to solve for unknown → sympy_solve
     - Need vector dot/cross/magnitude on component lists → vector_math

  4. If no more computation is needed, write on its own line:
     READY FOR FINAL ANSWER

  Keep your response under 150 words. Do NOT write tool-call syntax here.

thought_tool_invoked_prompt: |
  ## PHASE: LOOP DETECTED — YOU MUST CHANGE APPROACH

  You just tried to call {tool_name} with {tool_args}, but this exact call was already made earlier.

  MANDATORY: You must do ONE of the following (pick the first that applies):

  A) The earlier result already gives you what you need → Use that value and move to the next step.
  B) The earlier call failed or gave a wrong result → Reformulate using a DIFFERENT tool or DIFFERENT expression.
  C) You have enough information to answer → Write READY FOR FINAL ANSWER.

  State which option you chose (A, B, or C) and your reasoning in under 100 words.

  If you choose A or B, state your next computation with all values substituted.
  If you choose C, write READY FOR FINAL ANSWER on its own line.

finalizer_prompt: |
  ## PHASE: FINAL ANSWER

  Problem: {problem}

  Instructions:
  - Write a short solution (3-5 sentences max) stating the key formula used, the main computation, and the result.
  - Compare your result to the answer choices. Pick the closest match.
  - If your computed value does not match any option exactly, choose the nearest one. Do NOT recompute or second-guess the tools.
  - You MUST select exactly one letter: A, B, C, or D.

  Format:
  Solution: [brief solution]
  Calculated Result: [value with units]
  Answer: <A|B|C|D>

tool_invoked_prompt: |
  The tool {tool_name} with arguments {tool_args} was already executed earlier in this conversation. Its result is in a previous observation. Reuse that result — do NOT call this tool again.

max_react_iters: 8