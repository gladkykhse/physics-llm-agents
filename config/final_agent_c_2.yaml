main_system_prompt: |
  You are an expert physics problem-solving agent. You solve multiple-choice
  physics problems by first recalling the relevant theory, then planning, then
  carrying out the plan one step at a time.

  Rules:
  - Execute only the step you are asked to. Do not skip ahead.
  - State the principle, law, or formula you use in each step.
  - Reason through the physics yourself. When a step needs arithmetic, you may
    write the calculation to have it checked by a calculator, and use the exact
    value it returns. If a calculator value is shown to you, trust it.

analyze_prompt: |
  ## ANALYZE

  Analyze this physics problem and prepare to look up the relevant theory.

  First, think briefly:
  - What information is given? What must be found or determined?
  - Which physical principles, laws, or concepts apply? The problem may be
    theoretical or conceptual, not just numerical.
  - What approach will you use?

  Then identify the GENERAL theory to retrieve from Wikipedia.
  Rules for queries:
  - Never include specific numbers, values, or expressions from the problem.
  - Do not query basic math. Focus on physics laws, principles, definitions,
    effects, or formulas.
  - For a conceptual or theoretical problem, search for the underlying
    principle, law, effect, or definition it is testing.
  - Give 1 to 3 focused, non-overlapping queries.

  Respond in EXACTLY this format:

  ### Analysis
  <brief analysis: given, unknown, principles, approach>

  ### Knowledge Needed
  <what laws, principles, definitions, or formulas are needed>

  ### Search Queries
  1. <query>
  2. <query>

  Do not solve the problem yet.

filter_knowledge_prompt: |
  From the reference text below, extract ONLY what directly helps solve this
  problem: the key principles, laws, definitions, effects, formulas,
  constants, or conditions. Copy them exactly. Do NOT solve the problem and
  do NOT add anything not present in the text.

  Be brief: at most 8 short bullet points. If nothing in the text is relevant,
  reply with exactly: None.

  # Problem
  {problem}

  # Reference text
  {knowledge}

  # Output
  - <principle, law, definition, effect, formula, constant, or condition>

plan_prompt: |
  ## Analysis of the Problem
  {analysis}

  ## PLAN

  Based on the analysis above, write a step-by-step plan to solve this problem.
  Write 3 to 5 steps. Order them so each step uses only the given values or the
  results of earlier steps, and keep each step to a single calculation or idea.
  Respond with ONLY a numbered list, no other text.

  Format:
  1. [step description]
  2. [step description]
  3. [step description]

fix_plan_prompt: |
  ## Analysis of the Problem
  {analysis}

  ## Your Previous Response (could not be parsed)
  {failed_output}

  Rewrite your plan as ONLY a numbered list. Write 3 to 5 steps. No other text.

  Format:
  1. [step description]
  2. [step description]
  3. [step description]

execute_compute_prompt: |
  ## EXECUTE STEP {step_number} OF {total_steps}

  Task: {step_description}

  Carry out this step now. Use results from previous steps if needed.
  - State the principle, formula, or reasoning you are applying.
  - If a Reference block is present above, use it only when it is relevant;
    otherwise rely on your own physics knowledge.
  - If calculating, substitute all known values and show your work. You may add
    ONE CALC or SOLVE line (see the calculator note above) to check the
    arithmetic, then use the value it returns.
  - If reasoning, state your argument with clear justification.

  Be concise. Only complete this step.

calculator_reference: |
  # Calculator note (optional)
  When a step needs arithmetic you may add ONE line; the exact value is returned
  to you before the next step:
    CALC: <expression>            - a numeric value
    SOLVE: <equation> | <letter>  - only to isolate ONE unknown letter
  Rules: replace every quantity with its number; no units and no other letters.
  For SOLVE the equation contains "=" and only the one unknown remains. Trig is
  in radians. If the step is conceptual, do not use the calculator.

execute_reason_prompt: |
  ## EXECUTE STEP {step_number} OF {total_steps}

  Task: {step_description}

  Carry out only this step, using results from earlier steps if needed.
  - State the principle, law, or definition that applies and reason from it.
  - If a Reference block is shown above, use it only when it is relevant;
    otherwise rely on your own physics knowledge.
  - Be concise. Complete only this step.

finalizer_prompt: |
  ## FINAL ANSWER

  Problem: {problem}

  Using the reasoning and any calculator values shown above, give your answer.
  - Write a brief solution (2-4 sentences): the approach and the key result.
  - Compare your result with the options and pick the closest match.
  - Select exactly one letter: A, B, C, or D.

  Format:
  Solution: [brief solution]
  Calculated Result: [value with units, or n/a]
  Answer: <A|B|C|D>

max_plan_fix_iters: 3
max_execute_steps: 8

max_brief_chars: 1500

max_calcs_per_step: 4