# ─────────────────────────────────────────────────────────────
#  Combined Agent: Planning (math) + Direct Solve (theory)
# ─────────────────────────────────────────────────────────────

# ── Knowledge Retrieval ──────────────────────────────────────

cot_retrieve_knowledge_prompt: |
  Your task is to analyze a physics problem and generate search queries to retrieve relevant theory and formulas from Wikipedia.

  Rules:
  - NEVER include specific numbers, values, or functions from the problem in your queries. Wikipedia contains general theory, not specific solutions.
  - Do not query for basic math, algebra, or trigonometry. Focus only on physics concepts, laws, and formulas.
  - Carefully analyze the problem wording to identify the exact physical domain.
  - Generate 1 to 4 specific, non-overlapping queries.

  # Problem
  {problem}

  # Output Format

  ### 1. Core Concepts
  [Identify the physical phenomena and type of problem.]

  ### 2. Knowledge Gap
  [What laws, formulas, or constants are needed to solve this?]

  ### 3. Query Reasoning
  [Briefly explain your search terms. Verify no problem-specific numbers are included.]

  ### Search Queries
  1. query text here
  2. query text here
  3. ...

retrieve_knowledge_prompt: |
  # Task
  Execute the `wikipedia_multi_search` tool using the "Search Queries" you just identified.

  # Instructions
  - Provide the queries as a single list of strings for the `queries` argument.
  - Do not summarize the analysis; only perform the tool call.
  - Ensure the queries are technical, concise, and match your previous reasoning.

  # Tool Call Requirement
  Call `wikipedia_multi_search(queries=[...])` now.

filter_knowledge_prompt: |
  Select and copy the parts of the knowledge document that are useful for solving this physics problem. Do not solve the problem. Do not add any information that is not in the document.

  Problem:
  {problem}

  Knowledge document:
  {knowledge}

  Output:

  ## Relevant principles and facts
  - Copy exact statements from the document

  ## Relevant formulas
  - Copy exact formulas from the document

  ## Relevant conditions and assumptions
  - Copy exact conditions or special cases from the document

# ── Classification ───────────────────────────────────────────

problem_type_router_prompt: |
  Classify this physics problem into one of two categories.

  MATHEMATICAL: The problem gives specific numerical inputs (numbers, measurements, data) and you must perform arithmetic, algebra, or substitution on those numbers to derive the answer.
  THEORETICAL: The answer comes from recalling or reasoning about a physics concept, definition, law, formula, relationship, or known constant. No computation on problem-specific numerical inputs is needed. Even if the answer is a number or a formula, if you do not need to calculate anything from given data, it is THEORETICAL.

  Examples:
  - "What is the SI unit of capacitance?" → THEORETICAL (recall a definition)
  - "What is the kinetic energy of a 5 kg object moving at 10 m/s?" → MATHEMATICAL (must compute 0.5×5×10²)
  - "Which formula relates force, mass, and acceleration?" → THEORETICAL (recall a formula)
  - "A force of 20 N acts on a 4 kg object. What is the acceleration?" → MATHEMATICAL (must compute 20/4)
  - "What happens to the period of a pendulum if its length is doubled?" → THEORETICAL (reason about a relationship)
  - "Find the period of a pendulum of length 2 m." → MATHEMATICAL (must compute 2π√(2/9.81))

  Problem:
  {problem}

  First, in one sentence state what the problem asks you to DO: compute a result from numerical inputs, or recall/reason about a concept? Then on a new line output exactly one of:
  ANSWER: MATHEMATICAL
  ANSWER: THEORETICAL

# ── Theory Path: Direct Solve (no planning) ──────────────────

theory_system_prompt: |
  You are an expert physics problem-solving AI. Your task is to solve physics problems using retrieved knowledge when it is relevant and your own physics knowledge when it is not. Be direct and structured.

solve_prompt: |
  Think step by step to solve the problem below. Use the Wikipedia Search Results above if they are relevant. If they are incomplete or not useful, rely on your own physics knowledge.

  **Step 1 — Identify:** List the key given information. If numerical, convert to SI units.
  **Step 2 — Reasoning:** State the relevant physical principles. If the problem requires math, show the full calculation step by step. If the problem is theoretical, explain the logical reasoning.
  **Step 3 — Verify:** Write out every option A, B, C, D with its value. Compare each one to your result. State which one matches or is closest.
  **Step 4 — Answer:** On the very last line, write your answer in this exact format and nothing else:
  Answer: X
  where X is A, B, C, or D.

  Correct example: Answer: B

  ---
  **Problem:**
  {problem}

# ── Math Path: Analysis & Planning ───────────────────────────

analyze_prompt: |
  ## ANALYZE

  Analyze this problem before making a plan.
  - What information is given?
  - What needs to be found or determined?
  - What physics principles or concepts apply?
  - What approach will you use?

  If Wikipedia Search Results are provided above, note which formulas or facts from them are relevant.

  Think through this briefly. Do not solve the problem yet.

plan_math_prompt: |
  ## Analysis
  {analysis}

  ## PLAN

  Based on the analysis, write a step-by-step plan to solve this problem.
  Each step should require at most one or two computations.
  Write 2 to 5 steps. Respond with ONLY a numbered list, no other text.

  Format:
  1. [step description]
  2. [step description]
  3. [step description]

fix_plan_prompt: |
  ## Analysis
  {analysis}

  ## Your Previous Response (could not be parsed)
  {failed_output}

  Rewrite your plan as ONLY a numbered list. No other text.

  Format:
  1. [step description]
  2. [step description]
  3. [step description]

# ── Math Path: System Prompt ─────────────────────────────────

math_system_prompt: |
  You are an expert Physics Problem-Solving Agent. You solve physics problems step by step.

  You have access to three computation tools. In each turn you may call exactly ONE tool or decide that no tool is needed.

  ## TOOLS

  ### sympy_eval(expression: str) -> str
  Evaluates a FULLY NUMERIC expression. Every variable must be replaced with its number BEFORE calling.
  - Use ** for exponents, explicit * for multiplication, parentheses for grouping.
  - Trig functions use RADIANS: cos(60 * pi / 180), NOT cos(60).
  - Calculus: chain .subs(variable, value) to get a number. Example: diff(sin(2*t - pi/3), t).subs(t, 2*pi/3)
  - Scalars only. No vectors, no lists, no '=' sign.

  ### sympy_solve(equation: str, symbol: str) -> str
  Solves an equation for ONE unknown. Substitute ALL known values first so only ONE letter remains.
  - Use '=' for equations: "2 + 2*t - 4.905*t**2 = 0" with symbol="t"
  - Use explicit multiplication: 5*x, NOT 5x.

  ### vector_math(operation: str, v1: str, v2: str, scalar: str) -> str
  Vector operations on numeric component lists. Operations: magnitude, distance, normalize, dot, cross, add, sub, scale, angle.
  - All components must be pure numbers. Compute components first with sympy_eval if needed.
  - NEVER use vector_math for scalar arithmetic. Use sympy_eval instead.

  ## RULES
  - One tool call per turn. Check the result before proceeding.
  - If a step needs no computation, reason through it without calling tools.

# ── Math Path: Mini-ReAct Step Execution ─────────────────────

step_thought_prompt: |
  ## STEP {step_number} OF {total_steps}: {step_description}

  Follow these steps strictly:

  1. RESULT CHECK (skip on first turn of this step):
     Look at the latest tool output. What numeric value was returned?
     Does this value make physical sense?
     Does this value answer the task for THIS step: "{step_description}"?
     If YES — the step is resolved. Write on its own line:
     STEP COMPLETE
     Do NOT continue to points 2 or 3. Do NOT compute anything for later steps.

  2. PROGRESS:
     What quantities do I already know (with values)?
     What is the ONE quantity I need to compute to complete THIS step?
     If the Wikipedia Search Results contain a relevant formula or constant, use it.

  3. PLAN COMPUTATION:
     Write the complete expression with ALL numbers substituted in.
     Example: "I = 0.5 * 2 * (7/4)**2"
     Choose the correct tool:
     - All values are numbers → sympy_eval
     - Need to solve for unknown → sympy_solve
     - Need vector dot/cross/magnitude on component lists → vector_math

  Keep under 120 words. Do NOT write tool-call syntax here.

step_act_prompt: |
  Now call exactly ONE tool to execute the computation you described. If the expression contains any variables, substitute their numeric values first.

# ── Math Path: Step Summarization ────────────────────────────

summarize_step_prompt: |
  The task for step {step_number} was: {step_description}

  Step work:
  {step_output}

  Write ONE sentence answering ONLY the task above. Use this format:
  "Step {step_number} result: [quantity from task] = [numeric value] [units]."

  IMPORTANT: Only report the value that directly answers the task. Ignore any extra computations beyond the task.

# ── Math Path: Finalization ──────────────────────────────────

finalizer_prompt: |
  ## FINAL ANSWER

  Problem: {problem}

  Using the step results above, provide your answer.
  - Write a brief solution (3-5 sentences): state the approach, key formulas, and result.
  - Compare your result to the answer choices. Pick the closest match.
  - You MUST select exactly one letter: A, B, C, or D.

  Format:
  Solution: [brief solution]
  Calculated Result: [value with units]
  Answer: <A|B|C|D>

# ── Limits ───────────────────────────────────────────────────

max_plan_fix_iters: 3
max_step_react_iters: 3
max_plan_steps: 6